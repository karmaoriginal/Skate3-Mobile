plugins {
     id 'com.android.application'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');
def releaseKeystore = System.getenv('SKATE3_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('SKATE3_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SKATE3_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SKATE3_RELEASE_KEY_PASSWORD')

android {
    namespace = "chat.buku.skate3"
    compileSdkVersion 35
    ndkVersion = "27.2.12479018"
    signingConfigs {
        if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "chat.buku.skate3"
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 20200
        versionName "2.2.0"
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-debug"
        }
        qa {
            initWith debug
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa1"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
        }
        review {
            initWith debug
            applicationIdSuffix ".pr123"
            versionNameSuffix "-review"
            resValue "string", "app_name", "Skate 3 Review"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main { jniLibs.srcDir 'libs' }
    packagingOptions {
        jniLibs {
            // AdrenoTools needs extracted hook libraries in nativeLibraryDir.
            useLegacyPackaging true
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Archive support for game dumps, mods and GPU driver packages.
    // junrar is under the UnRar license; commons-compress/io/lang3 are Apache-2.0.
    implementation 'com.github.junrar:junrar:8.1.2'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}
